  <!-- PUSTAKA MATEMATIKIN.JS (EMBEDDED LANGSUNG AGAR LIVE DEMO BERJALAN)    -->
  <!-- ===================================================================== -->
  <script>
    const PI = Math.PI;
    const E = Math.E;
    const PHI = (1 + Math.sqrt(5)) / 2;

    const cekBulat = (n) => Number.isInteger(n);
    const cekBilKuadrat = (n) => typeof n === 'number' && n >= 0 && cekBulat(Math.sqrt(n));

    const faktorPrimaTerkecil = (n) => {
      if (typeof n !== 'number' || !Number.isFinite(n)) return NaN;
      n = Math.abs(n);
      if (!Number.isInteger(n) || n === 0) return 0;
      if (n === 1) return 1;
      if (n % 2 === 0) return 2;
      if (n % 3 === 0) return 3;
      if (n % 5 === 0) return 5;
      const m = Math.sqrt(n);
      for (let i = 7; i <= m; i += 30) {
        if (n % i === 0) return i;
        if (n % (i + 4) === 0) return i + 4;
        if (n % (i + 6) === 0) return i + 6;
        if (n % (i + 10) === 0) return i + 10;
        if (n % (i + 12) === 0) return i + 12;
        if (n % (i + 16) === 0) return i + 16;
        if (n % (i + 22) === 0) return i + 22;
        if (n % (i + 24) === 0) return i + 24;
      }
      return n;
    };

    const cekPrima = (n) => {
      if (!Number.isInteger(n) || n < 2) return false;
      return n === faktorPrimaTerkecil(n);
    };

    const faktorisasiPrima = (n) => {
      if (!Number.isInteger(n) || n === 0 || Math.abs(n) === 1) return n.toString();
      if (n < 0) return `-${faktorisasiPrima(-n)}`;
      const minFactor = faktorPrimaTerkecil(n);
      if (n === minFactor) return n.toString();
      return `${minFactor}*${faktorisasiPrima(n / minFactor)}`;
    };

    const primaBerikutnya = (n) => {
      if (typeof n !== 'number' || !Number.isFinite(n)) return NaN;
      if (n < 2) return 2;
      n = Math.floor(n);
      const nilaiAwal = n + (n % 2) + 1;
      for (let i = nilaiAwal; i <= Number.MAX_SAFE_INTEGER; i += 2) {
        if (cekPrima(i)) return i;
      }
      return NaN;
    };

    const primaKembarBerikutnya = (n) => {
      if (typeof n !== 'number' || !Number.isFinite(n)) return NaN;
      if (n < 3) return 3;
      if (n < 5) return 5;
      n = Math.floor(n);
      const nilaiAwal = 6 * Math.ceil((n + 2) / 6);
      for (let i = nilaiAwal; i <= Number.MAX_SAFE_INTEGER; i += 6) {
        if (cekPrima(i - 1) && cekPrima(i + 1)) return i - 1;
      }
      return NaN;
    };

    const primaKuadrupletBerikutnya = (n) => {
      if (typeof n !== 'number' || !Number.isFinite(n)) return NaN;
      if (n < 5) return 5;
      if (n < 11) return 11;
      n = Math.floor(n);
      const nilaiAwal = 30 * Math.ceil((n - 10) / 30);
      for (let i = nilaiAwal; i <= Number.MAX_SAFE_INTEGER; i += 30) {
        if (cekPrima(i + 11) && cekPrima(i + 13) && cekPrima(i + 17) && cekPrima(i + 19)) {
          return i + 11;
        }
      }
      return NaN;
    };

    const faktorial = (n) => {
      if (typeof n !== 'number' || !Number.isInteger(n) || n < 0) return NaN;
      if (n === 0 || n === 1) return 1;
      let hasil = 1;
      for (let i = 2; i <= n; i++) hasil *= i;
      return hasil;
    };

    const daftarFaktorPrima = (n) => {
      if (typeof n !== 'number' || !Number.isInteger(n) || n < 1) {
        throw new Error("Input harus berupa bilangan bulat positif (>= 1)");
      }
      let hasil = [];
      while (n !== 1) {
        let faktor = faktorPrimaTerkecil(n);
        hasil.push(faktor);
        n /= faktor;
      }
      return hasil;
    };

    const _fpbDuaAngka = (a, b) => {
      a = Math.abs(a); b = Math.abs(b);
      while (b !== 0) {
        let sisa = a % b;
        a = b; b = sisa;
      }
      return a;
    };

    const _kpkDuaAngka = (a, b) => {
      if (a === 0 || b === 0) return 0;
      return Math.abs(a / _fpbDuaAngka(a, b) * b);
    };

    const faktorKuadratTerbesar = (n) => {

      }
      throw new Error("MATEMATIKIN: Bentuk persamaan harus 'umum' atau 'gradien'.");
    };

    const jarakTitikKeGaris = (titik, garis) => {
      const [x0, y0] = _keArrayTitik(titik);
      let a, b, c;
      if (garis !== null && typeof garis === 'object' && !Array.isArray(garis) && 'a' in garis) {
        ({ a, b, c = 0 } = garis);
      } else {
        const [titik1, titik2] = _keArrayGaris(garis);
        ({ a, b, c } = _koefisienGaris(titik1, titik2));
      }
      _pastikanAngka(x0, y0, a, b, c);
      const penyebut = Math.hypot(a, b);
      if (penyebut === 0) throw new Error("MATEMATIKIN: Koefisien a dan b tidak boleh keduanya nol.");
      return _rapikan(Math.abs(a * x0 + b * y0 + c) / penyebut);
    };

    const luasPoligon = (...titik) => {
      if (titik.length === 1 && Array.isArray(titik[0]) && titik[0].length > 0 && titik[0].every(_adalahTitik)) {
        titik = titik[0];
      }
      if (titik.length < 3) throw new Error("MATEMATIKIN: Poligon membutuhkan minimal 3 titik.");
      const koordinat = titik.map(_keArrayTitik);
      _pastikanAngka(...koordinat.flatMap(t => [t[0], t[1]]));
      let jumlahSilang = 0;
      for (let i = 0; i < koordinat.length; i++) {
        const [xi, yi] = koordinat[i];
        const [xj, yj] = koordinat[(i + 1) % koordinat.length];
        jumlahSilang += xi * yj - xj * yi;
      }
      return _rapikan(Math.abs(jumlahSilang) / 2);
    };

    const luasSegitiga = (titik1, titik2, titik3) => luasPoligon(titik1, titik2, titik3);

    const _pastikanSukuKe = (n) => {
      if (!Number.isInteger(n) || n < 1) throw new Error("MATEMATIKIN: Suku ke-n harus bilangan bulat positif (n >= 1).");
    };

    const sukuAritmetika = (a, b, n) => { _pastikanAngka(a, b); _pastikanSukuKe(n); return _rapikan(a + (n - 1) * b); };
    const jumlahAritmetika = (a, b, n) => { _pastikanAngka(a, b); _pastikanSukuKe(n); return _rapikan(n * (2 * a + (n - 1) * b) / 2); };
    const sukuGeometri = (a, r, n) => { _pastikanAngka(a, r); _pastikanSukuKe(n); return _rapikan(a * r ** (n - 1)); };
    const jumlahGeometri = (a, r, n) => {
      _pastikanAngka(a, r); _pastikanSukuKe(n);
      if (r === 1) return _rapikan(a * n);
      return _rapikan(a * (r ** n - 1) / (r - 1));
    };
    const jumlahGeometriTakHingga = (a, r) => {
      _pastikanAngka(a, r);
      if (!(Math.abs(r) < 1)) throw new Error("MATEMATIKIN: Deret geometri tak hingga hanya konvergen jika |r| < 1.");
      return _rapikan(a / (1 - r));

      }
    };
    const _medianUrut = (urut) => {
      const tengah = Math.floor(urut.length / 2);
      return urut.length % 2 === 0 ? (urut[tengah - 1] + urut[tengah]) / 2 : urut[tengah];
    };
    const _rataMentah = (arr) => arr.reduce((total, n) => total + n, 0) / arr.length;

    const kuartil = (arr, q) => {
      _validasiData(arr, 2);
      const urut = [...arr].sort((a, b) => a - b);
      const tengah = Math.floor(urut.length / 2);
      const bawah = urut.slice(0, tengah);
      const atas = urut.slice(urut.length % 2 === 0 ? tengah : tengah + 1);
      const hasil = {
        q1: bulatkanDesimal(_medianUrut(bawah), 2),
        q2: bulatkanDesimal(_medianUrut(urut), 2),
        q3: bulatkanDesimal(_medianUrut(atas), 2)
      };
      if (q === undefined) return hasil;
      if (![1, 2, 3].includes(q)) throw new Error("MATEMATIKIN: Parameter q harus bernilai 1, 2, atau 3.");
      return hasil[`q${q}`];

      _validasiData(arr, 1);
      const urut = [...arr].sort((a, b) => a - b);
      return _rapikan(urut[urut.length - 1] - urut[0]);
    };

    const jangkauanInterkuartil = (arr) => {
      const { q1, q3 } = kuartil(arr);
      return _rapikan(q3 - q1);
    };

    const simpanganKuartil = (arr) => jangkauanInterkuartil(arr) / 2;

    const simpanganRataRata = (arr) => {
      _validasiData(arr, 1);
      const rata = _rataMentah(arr);
      return bulatkanDesimal(_rataMentah(arr.map(n => Math.abs(n - rata))), 2);
    };

    const variansSampel = (arr) => {
      _validasiData(arr, 2);
      const rata = _rataMentah(arr);
      const jumlahKuadratSelisih = arr.reduce((total, n) => total + (n - rata) ** 2, 0);
      return bulatkanDesimal(jumlahKuadratSelisih / (arr.length - 1), 2);
    };

    const simpanganBakuSampel = (arr) => {
      _validasiData(arr, 2);
      const rata = _rataMentah(arr);
      const jumlahKuadratSelisih = arr.reduce((total, n) => total + (n - rata) ** 2, 0);
      return bulatkanDesimal(Math.sqrt(jumlahKuadratSelisih / (arr.length - 1)), 2);
    };

    const _keArrayPecahan = (p) => {
      let pembilang, penyebut;
      if (Number.isInteger(p)) [pembilang, penyebut] = [p, 1];
      else if (Array.isArray(p) && p.length === 2) [pembilang, penyebut] = p;
      else throw new Error("MATEMATIKIN: Pecahan harus berupa bilangan bulat atau array [pembilang, penyebut].");
      if (!Number.isInteger(pembilang) || !Number.isInteger(penyebut)) throw new Error("MATEMATIKIN: Pembilang dan penyebut harus bilangan bulat.");
      if (penyebut === 0) throw new Error("MATEMATIKIN: Penyebut pecahan tidak boleh bernilai nol.");
      return [pembilang, penyebut];
    };

    const _sederhanakanPecahan = (pembilang, penyebut) => {
      if (pembilang === 0) return [0, 1];
      const pembagi = _fpbDuaAngka(pembilang, penyebut);
      let [a, b] = [pembilang / pembagi, penyebut / pembagi];
      if (b < 0) { a = -a; b = -b; }
      return [a, b];
    };

    const hitungPecahan = (pecahan1, pecahan2, operasi = 'tambah') => {
      const [n1, d1] = _keArrayPecahan(pecahan1);
      const [n2, d2] = _keArrayPecahan(pecahan2);
      switch (operasi) {
        case 'tambah':
        case 'kurang': {
          const penyebut = _kpkDuaAngka(d1, d2);
          const tanda = operasi === 'tambah' ? 1 : -1;
          return _sederhanakanPecahan(n1 * (penyebut / d1) + tanda * n2 * (penyebut / d2), penyebut);
        }
        case 'kali': return _sederhanakanPecahan(n1 * n2, d1 * d2);
        case 'bagi':
          if (n2 === 0) throw new Error("MATEMATIKIN: Tidak dapat membagi dengan pecahan bernilai nol.");
          return _sederhanakanPecahan(n1 * d2, d1 * n2);
        default: throw new Error("MATEMATIKIN: Operasi harus 'tambah', 'kurang', 'kali', atau 'bagi'.");
      }
    };

    const operasiPecahan = (pecahan1, pecahan2, operasi = 'tambah') => {
      const [pembilang, penyebut] = hitungPecahan(pecahan1, pecahan2, operasi);
      return pecahan(pembilang, penyebut);
    };

    const desimalKePecahan = (desimal, opsi = {}) => {
      if (typeof desimal !== 'number' || !Number.isFinite(desimal)) throw new Error("MATEMATIKIN: Input harus berupa angka terhingga.");
      const maksPenyebut = opsi.maksPenyebut === undefined ? 1e6 : opsi.maksPenyebut;
      const tanda = desimal < 0 ? -1 : 1;
      const x = Math.abs(desimal);
      const toleransi = (opsi.toleransi === undefined ? 1e-14 : opsi.toleransi) * Math.max(1, x);
      let hasil;
      if (Number.isInteger(x)) {
        hasil = [tanda * x + 0, 1];
      } else {
        let pKemarin = 1, qKemarin = 0;
        let bulatan = Math.floor(x);
        let p = bulatan, q = 1;
        let sisa = x - bulatan;
        while (sisa > 1e-15 && Math.abs(x - p / q) > toleransi) {
          const kebalikan = 1 / sisa;
          bulatan = Math.floor(kebalikan);
          sisa = kebalikan - bulatan;
          const pBaru = bulatan * p + pKemarin;
          const qBaru = bulatan * q + qKemarin;
          if (qBaru > maksPenyebut) break;
          [pKemarin, qKemarin, p, q] = [p, q, pBaru, qBaru];
        }
        hasil = [tanda * p + 0, q];
      }

    };

    const integral = (f, a, b, opsi = {}) => {
      if (typeof f !== 'function') throw new Error("MATEMATIKIN [integral]: Parameter pertama harus berupa fungsi.");
      _pastikanAngka(a, b);
      if (a === b) return 0;
      let n = opsi.n === undefined ? 1000 : opsi.n;
      if (!Number.isInteger(n) || n < 2) throw new Error("MATEMATIKIN [integral]: opsi.n harus bilangan bulat minimal 2.");
      if (n % 2 !== 0) n++;
      const h = (b - a) / n;
      let jumlahGanjil = 0, jumlahGenap = 0;
      for (let i = 1; i < n; i++) {

      if (numerus <= 0) throw new Error("MATEMATIKIN: Numerus logaritma harus lebih besar dari 0.");
      let hasil = basis === 10 ? Math.log10(numerus) : (basis === 2 ? Math.log2(numerus) : Math.log(numerus) / Math.log(basis));
      return _rapikan(hasil);
    };

    const _kataSatuan = ['nol', 'satu', 'dua', 'tiga', 'empat', 'lima', 'enam', 'tujuh', 'delapan', 'sembilan', 'sepuluh', 'sebelas'];
    const _terbilangTigaDigit = (n) => {
      const kata = [];
      const ratus = Math.floor(n / 100), sisa = n % 100;
      if (ratus === 1) kata.push('seratus');
      else if (ratus > 1) kata.push(`${_kataSatuan[ratus]} ratus`);

        else if (sisa < 20) kata.push(`${_kataSatuan[sisa - 10]} belas`);
        else {

          if (sisa % 10 > 0) kata.push(_kataSatuan[sisa % 10]);
        }
      }
      return kata.join(' ');
    };
    const _terbilangBulat = (n) => {
      if (n === 0) return 'nol';
      const skala = ['', 'ribu', 'juta', 'miliar', 'triliun', 'kuadriliun'];
      const kelompok = [];
      for (let sisa = n; sisa > 0; sisa = Math.floor(sisa / 1000)) kelompok.push(sisa % 1000);
      const bagian = [];
      for (let i = kelompok.length - 1; i >= 0; i--) {

        if (i === 1 && kelompok[i] === 1) bagian.push('seribu');
        else bagian.push(skala[i] ? `${_terbilangTigaDigit(kelompok[i])} ${skala[i]}` : _terbilangTigaDigit(kelompok[i]));
      }

    const terbilang = (n) => {
      if (typeof n !== 'number' || !Number.isFinite(n)) throw new Error("MATEMATIKIN: Input harus berupa angka terhingga.");
      const teks = String(Math.abs(n));

      const [bagianBulat, bagianDesimal] = teks.split('.');

      let hasil = _terbilangBulat(Number(bagianBulat));
      if (bagianDesimal) hasil += ` koma ${[...bagianDesimal].map(digit => _kataSatuan[Number(digit)]).join(' ')}`;
      return n < 0 ? `minus ${hasil}` : hasil;

  warnaqr: "#1d4ed8"
});
return "Tabel soal beserta QR Code berhasil dirender di atas!";`
          }
        ]
      }
    ];

    // =========================================================================
    // LOGIKA APLIKASI DOKUMENTASI (NAVIGASI, PENCARIAN, & LIVE RUNNER)
    // =========================================================================
    const sidebar = document.getElementById('sidebar');
    const sidebarNav = document.getElementById('sidebarNav');
    const mainContent = document.getElementById('mainContent');
    const searchInput = document.getElementById('searchInput');
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');

    mobileMenuBtn.addEventListener('click', () => {
      sidebar.classList.toggle('open');
    });

    function dapatkanSemuaRute() {
      const urut = [];
      DOCS_DATA.forEach(kat => {
        (kat.halamanKhusus || []).forEach(h => {
          urut.push({ route: h.id, label: h.nama });
        });
        if ((kat.fungsi || []).length > 0) {
          urut.push({ route: `kategori/${kat.id}`, label: `Kategori: ${kat.judul}` });
        }
        (kat.fungsi || []).forEach(f => {
          urut.push({ route: `fungsi/${f.id}`, label: f.nama });
        });
      });
      return urut;
    }

    function renderSidebar(filter = '') {
      const q = filter.trim().toLowerCase();
      let html = '';

      DOCS_DATA.forEach(kat => {
        const halamanKhususCocok = (kat.halamanKhusus || []).filter(h =>
          h.nama.toLowerCase().includes(q)
        );
        const fungsiCocok = (kat.fungsi || []).filter(f =>
          f.nama.toLowerCase().includes(q) || f.ringkasan.toLowerCase().includes(q)
        );

        const kategoriCocok = kat.judul.toLowerCase().includes(q);
        if (q && !kategoriCocok && halamanKhususCocok.length === 0 && fungsiCocok.length === 0) {
          return;
        }

        const daftarFungsiTampil = kategoriCocok ? (kat.fungsi || []) : fungsiCocok;
        const daftarKhususTampil = kategoriCocok ? (kat.halamanKhusus || []) : halamanKhususCocok;

        const targetCatHref = (kat.fungsi && kat.fungsi.length > 0) ? `#kategori/${kat.id}` : `#pengenalan`;
        const targetCatRoute = (kat.fungsi && kat.fungsi.length > 0) ? `kategori/${kat.id}` : `pengenalan`;

        html += `
          <div class="nav-group">
            <a href="${targetCatHref}" class="nav-cat-link" data-route="${targetCatRoute}">
              <span>${kat.judul}</span>
              ${(kat.fungsi || []).length > 0 ? `<span class="cat-count">${kat.fungsi.length}</span>` : ''}
            </a>
            <ul class="nav-items">
        `;

        daftarKhususTampil.forEach(h => {
          html += `<li class="nav-item"><a href="#${h.id}" class="text-link" data-route="${h.id}">📖 ${h.nama}</a></li>`;
        });

        daftarFungsiTampil.forEach(f => {
          html += `<li class="nav-item"><a href="#fungsi/${f.id}" data-route="fungsi/${f.id}">${f.nama}</a></li>`;
        });

        html += `</ul></div>`;
      });

      sidebarNav.innerHTML = html || `<p style="padding:0.5rem;font-size:0.85rem;">Tidak ada fungsi yang cocok.</p>`;
      tandaiMenuAktif();
    }

    function tandaiMenuAktif() {
      const hash = location.hash.slice(1) || 'pengenalan';
      document.querySelectorAll('.sidebar a[data-route]').forEach(a => {
        a.classList.toggle('active', a.getAttribute('data-route') === hash);
      });
    }

    function buatNavigasiBawah(currentRoute) {
      const semua = dapatkanSemuaRute();
      const idx = semua.findIndex(r => r.route === currentRoute);
      if (idx === -1) return '';

      const prev = idx > 0 ? semua[idx - 1] : null;
      const next = idx < semua.length - 1 ? semua[idx + 1] : null;

      return `
        <div class="page-nav">
          ${prev ? `<a href="#${prev.route}"><span>← Sebelumnya</span><strong>${prev.label}</strong></a>` : `<div></div>`}
          ${next ? `<a href="#${next.route}" style="text-align:right;"><span>Berikutnya →</span><strong>${next.label}</strong></a>` : `<div></div>`}
        </div>
      `;
    }

    function renderHalaman() {
      const hash = location.hash.slice(1) || 'pengenalan';
      sidebar.classList.remove('open');
      tandaiMenuAktif();

      // 1. Cek Halaman Khusus
      for (const kat of DOCS_DATA) {
        for (const h of (kat.halamanKhusus || [])) {
          if (h.id === hash) {
            mainContent.innerHTML = h.kontenHTML + buatNavigasiBawah(hash);
            window.scrollTo(0, 0);
            return;
          }
        }
      }

      // 2. Cek Halaman Kategori (#kategori/...)
      if (hash.startsWith('kategori/')) {
        const katId = hash.split('/')[1];
        const kat = DOCS_DATA.find(k => k.id === katId);
        if (kat) {
          const fnCards = (kat.fungsi || []).map(f => `
            <a href="#fungsi/${f.id}" class="fn-card">
              <div>
                <h3>${f.nama}</h3>
                <p>${f.ringkasan}</p>
              </div>
            </a>
          `).join('');

          mainContent.innerHTML = `
            <a href="#pengenalan" class="breadcrumb">📚 Dokumentasi matematikin.js (v0.0.1 beta)</a>
            <h1>${kat.judul}</h1>
            <p class="lead">${kat.deskripsi}</p>

            <h2>Daftar Topik & Fungsi (${(kat.fungsi || []).length} Entri)</h2>
            <div class="card-grid">
              ${fnCards}
            </div>
            ${buatNavigasiBawah(hash)}
          `;
          window.scrollTo(0, 0);
          return;
        }
      }

      // 3. Cek Halaman Detail Fungsi (#fungsi/...)
      if (hash.startsWith('fungsi/')) {
        const fnId = hash.split('/')[1];
        for (const kat of DOCS_DATA) {
          const fn = (kat.fungsi || []).find(f => f.id === fnId);
          if (fn) {
            tampilkanHalamanFungsi(kat, fn, hash);
            window.scrollTo(0, 0);
            return;
          }
        }
      }

      location.hash = '#pengenalan';
    }

    function tampilkanHalamanFungsi(kat, fn, hash) {
      const barisParam = (fn.parameter && fn.parameter.length > 0)
        ? fn.parameter.map(p => `
            <tr>
              <td><code>${p.nama}</code></td>
              <td><code>${p.tipe}</code></td>
              <td>${p.ket}</td>
            </tr>
          `).join('')
        : `<tr><td colspan="3" style="color:var(--text-muted);">Konstanta atau fungsi ini dapat dipanggil tanpa parameter wajib.</td></tr>`;

      const bagianOpsi = (fn.opsi && fn.opsi.length > 0)
        ? `
          <h2>Opsi Konfigurasi (<code>opsi</code>)</h2>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>Nama Opsi</th><th>Tipe</th><th>Nilai Bawaan</th><th>Keterangan</th></tr>
              </thead>
              <tbody>
                ${fn.opsi.map(o => `
                  <tr>
                    <td><code>${o.nama}</code></td>
                    <td><code>${o.tipe}</code></td>
                    <td><code>${o.bawaan}</code></td>
                    <td>${o.ket}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `
        : '';

      mainContent.innerHTML = `
        <a href="#kategori/${kat.id}" class="breadcrumb">← Kategori: ${kat.judul}</a>
        <h1><code>${fn.nama}</code></h1>
        <p class="lead">${fn.ringkasan}</p>

        <h2>Format Kode (Sintaks)</h2>
        <pre><code>${fn.sintaks}</code></pre>

        <h2>Parameter</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Parameter</th><th>Tipe</th><th>Keterangan</th></tr>
            </thead>
            <tbody>${barisParam}</tbody>
          </table>
        </div>

        ${bagianOpsi}

        <h2>Contoh & Uji Coba Interaktif (Live Runner)</h2>
        <p>Anda dapat mengubah angka atau parameter di sebelah kiri lalu menekan <strong>▶ Jalankan Kode</strong> untuk menguji hasilnya secara langsung:</p>
        <div class="demo-container">
          <div class="code-editor-panel">
            <div class="panel-toolbar">
              <span>KODE CONTOH JAVASCRIPT</span>
              <div class="toolbar-actions">
                <button class="btn-small" id="btnCopyCode">Salin Kode</button>
                <button class="btn-small" id="btnResetCode">Reset</button>
                <button class="btn-small primary" id="btnRunCode">▶ Jalankan Kode</button>
              </div>
            </div>
            <textarea id="liveCodeEditor" class="code-textarea" spellcheck="false"></textarea>
          </div>

          <div class="preview-panel">
            <div class="preview-header">
              <span>HASIL EKSEKUSI & PRATINJAU LATEX</span>
            </div>
            <div class="preview-canvas">
              <div id="livePreviewContainer" style="width:100%;"></div>
              <div id="liveLatexBox" class="latex-preview-box" style="display:none;">
                <span class="latex-preview-label">Pratinjau Rumus LaTeX (KaTeX)</span>
                <div id="liveLatexContent"></div>
              </div>
              <div id="liveConsoleOutput" class="console-output"></div>
            </div>
          </div>
        </div>

        ${buatNavigasiBawah(hash)}
      `;

      const editor = document.getElementById('liveCodeEditor');
      const previewContainer = document.getElementById('livePreviewContainer');
      const consoleBox = document.getElementById('liveConsoleOutput');
      const latexBox = document.getElementById('liveLatexBox');
      const latexContent = document.getElementById('liveLatexContent');
      editor.value = fn.contohKode;

      function formatNilaiLog(v) {
        if (typeof v === 'string') return v;
        try { return JSON.stringify(v); } catch (e) { return String(v); }
      }

      function jalankanKode() {
        previewContainer.innerHTML = '';
        latexBox.style.display = 'none';
        consoleBox.style.color = '#38bdf8';
        const barisLog = [];

        const customConsole = {
          log: (...args) => barisLog.push(args.map(formatNilaiLog).join(' ')),
          warn: (...args) => barisLog.push('⚠️ ' + args.map(formatNilaiLog).join(' ')),
          error: (...args) => barisLog.push('❌ ' + args.map(formatNilaiLog).join(' '))
        };

        try {
          const runner = new Function('container', 'console', editor.value);
          const hasilReturn = runner(previewContainer, customConsole);

          if (hasilReturn !== undefined) {
            barisLog.push('\n💡 Nilai Return: ' + formatNilaiLog(hasilReturn));

            // Jika hasilReturn berupa string yang mengandung sintaks LaTeX atau persamaan matematika, render dengan KaTeX
            if (typeof hasilReturn === 'string' && (hasilReturn.includes('\\') || hasilReturn.includes('^') || hasilReturn.includes('='))) {
              if (window.katex) {
                latexBox.style.display = 'block';
                window.katex.render(hasilReturn, latexContent, { displayMode: true, throwOnError: false });
              }
            }
          }

          consoleBox.textContent = barisLog.join('\n') || '✓ Kode berhasil dijalankan.';
        } catch (err) {
          consoleBox.style.color = '#f87171';
          consoleBox.textContent = '⚠️ Error: ' + err.message;
        }
      }

      document.getElementById('btnRunCode').addEventListener('click', jalankanKode);
      document.getElementById('btnResetCode').addEventListener('click', () => {
        editor.value = fn.contohKode;
        jalankanKode();
      });
      document.getElementById('btnCopyCode').addEventListener('click', (e) => {
        navigator.clipboard.writeText(editor.value);
        e.target.textContent = '✓ Tersalin!';
        setTimeout(() => { e.target.textContent = 'Salin Kode'; }, 1500);
      });

      jalankanKode();
    }

    searchInput.addEventListener('input', e => renderSidebar(e.target.value));
    window.addEventListener('hashchange', renderHalaman);

    // Inisialisasi saat halaman pertama kali dibuka
    renderSidebar();
    renderHalaman();
  </script>
</body>

</html>
